Description: |
  Equalizer lets you shape your sound by dragging a curve: six bands, or ten
  in advanced mode, with a preamp, a clipping warning and auto preamp. Save,
  share and import presets, including AutoEQ ParametricEQ.txt and
  GraphicEQ.txt. It works with players that hand their audio to equalizers,
  such as Spotify and Poweramp; without root, Android lets no app equalize all
  audio. No ads, accounts or tracking, and no internet permission.

